name: Build iOS (unsigned IPA)

# Run it by hand: GitHub -> Actions -> "Build iOS (unsigned IPA)" -> Run workflow
on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Get the code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - name: Install flutter_rust_bridge tool (same version as the app uses)
        run: |
          FRB_VERSION=$(grep -A8 '^  flutter_rust_bridge:' pubspec.lock | grep 'version:' | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "Using flutter_rust_bridge_codegen $FRB_VERSION"
          cargo install flutter_rust_bridge_codegen --version "$FRB_VERSION" --locked

      - name: Get Flutter packages
        run: flutter pub get

      - name: Generate Rust bridge code
        run: flutter_rust_bridge_codegen generate

      - name: Build iOS app (no signing)
        run: flutter build ios --release --no-codesign

      - name: Pack into an IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/Runner.app
          zip -qr Mangayomi-unsigned.ipa Payload

      - name: Save the IPA so you can download it
        uses: actions/upload-artifact@v4
        with:
          name: Mangayomi-unsigned-ipa
          path: Mangayomi-unsigned.ipa
          retention-days: 14
